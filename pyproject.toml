[build-system]
requires=["setuptools>=69", "wheel"]
build-backend="setuptools.build_meta"

[project]
name="ex-migration-discovery"
version="0.3.1"
description="Read-only discovery and offline analysis for Juniper EX migrations"
requires-python=">=3.8"
dependencies=["junos-eznc>=2.7.3,<3", "lxml>=5,<7"]

[project.optional-dependencies]
test=["pytest>=8,<9"]

[project.scripts]
ex-migration-discovery="ex_migration_discovery.cli:main"
ex-migration-analyzer="ex_migration_analyzer.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
