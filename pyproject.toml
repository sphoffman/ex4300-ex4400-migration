[build-system]
requires=["setuptools>=69", "wheel"]
build-backend="setuptools.build_meta"

[project]
name="ex-migration-discovery"
version="0.26.0"
description="Evidence-driven EX4300-to-EX4400 migration automation with site initialization, QFX baseline staging, guided operator workflow, historical MAC lookup, discovery, planning, guarded EX/QFX staging, recovery, endpoint activation, validation, and cleanup"
requires-python=">=3.8"
dependencies=["junos-eznc>=2.7.3,<3", "lxml>=5,<7", "jinja2>=3.1,<4", "paramiko>=3,<5"]

[project.optional-dependencies]
test=["pytest>=8,<9", "jsonschema==4.17.3"]

[project.scripts]
ex-migration-discovery="ex_migration_discovery.cli:main"
ex-migration-analyzer="ex_migration_analyzer.cli:main"
ex-migration-planner="ex_migration_planner.cli:main"
ex-migration-provisioner="ex_migration_provisioner.cli:main"
ex-migration-operator="ex_migration_operator.cli:main"
ex-migration-site="ex_migration_site.cli:main"
ex-migration-precutover-probe="ex_migration_provisioner.precutover_probe_cli:main"
ex-migration-qfx-plan="ex_migration_provisioner.qfx_plan_cli:main"
ex-migration-qfx-stage="ex_migration_provisioner.qfx_stage_cli:main"
ex-migration-port-state="ex_migration_provisioner.port_state_cli:main"
ex-migration-inband="ex_migration_provisioner.inband_cli:main"
ex-migration-qfx-bootstrap="ex_migration_qfx_bootstrap.cli:main"

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
